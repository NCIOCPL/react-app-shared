name: Deploy Storybook

# Publishes Storybook to GitHub Pages (served from the gh-pages branch):
#
#   main:  https://nciocpl.github.io/react-app-shared/
#   PRs:   https://nciocpl.github.io/react-app-shared/pr-preview/pr-<number>/
#
# PR previews are removed when the PR is closed or merged, and any preview
# not updated for 14 days is removed by storybook-preview-expire.yml.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: read

jobs:
  build:
    # Nothing to build when a PR is closed; the preview is just removed.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

  deploy-main:
    name: Deploy main to GitHub Pages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Disable Jekyll processing
        run: touch storybook-static/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: storybook-static
          branch: gh-pages
          # Keep PR previews when replacing the main Storybook.
          clean-exclude: pr-preview/
          commit-message: 'Deploy Storybook from ${{ github.sha }}'

  preview:
    name: PR preview
    needs: build
    # Always run for closed PRs (build is skipped) so the preview is removed.
    # Skip forks: their token cannot push to gh-pages.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Storybook artifact
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Deploy or remove PR preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: storybook-static
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
